# Builds an installable Android APK in the cloud (no Android Studio needed).
# Run it: repository > Actions > "Build Android APK" > Run workflow. The APK is under "Artifacts" at the bottom of the finished run.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'capacitor.config.json', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node scripts/build.mjs
      - run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: qalaa-almamal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
